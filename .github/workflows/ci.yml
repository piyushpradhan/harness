name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: typecheck + lint + test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        env:
          # Typecheck/lint/test don't need the Electron binary (~100 MB download).
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test
